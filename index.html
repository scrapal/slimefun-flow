<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>粘液科技配方流程图</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">SF</div>
          <div>
            <h1>粘液科技配方图</h1>
            <p>搜索物品并展开全部衍生材料</p>
          </div>
        </div>

        <label class="search-box">
          <span>搜索物品</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="例：钢锭 / Steel Ingot" />
        </label>

        <div id="searchResults" class="result-list" aria-label="搜索结果"></div>

        <div class="settings">
          <label class="toggle-row">
            <input id="deepToggle" type="checkbox" checked />
            <span>展开可合成材料</span>
          </label>
          <label class="toggle-row">
            <input id="compactToggle" type="checkbox" />
            <span>紧凑视图</span>
          </label>
          <label class="file-picker">
            <input id="dataImport" type="file" accept="application/json" />
            <span>导入配方 JSON</span>
          </label>
        </div>

        <details class="usage-guide" open>
          <summary>使用说明</summary>
          <ul>
            <li>搜索后点击物品，右侧会显示基础信息和直接配方。</li>
            <li>点击图中材料节点：展开或收起它的衍生材料。</li>
            <li>Shift + 左键点击材料节点：进入这个材料的合成页面。</li>
            <li>勾选节点复选框：标记这个材料及它下面的衍生材料已完成。</li>
            <li>Shift + 勾选复选框：勾选或取消所有相同物品。</li>
            <li>鼠标移到直接配方图标上可看材料名称，点击可进入材料页面。</li>
            <li>“导出图片”可以下载当前材料树。</li>
          </ul>
        </details>

        <nav class="legal-links" aria-label="网站信息">
          <a href="./about.html">关于</a>
          <a href="./privacy.html">隐私</a>
          <a href="./terms.html">条款</a>
        </nav>

      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div>
            <h2 id="graphTitle">配方流程图</h2>
            <p id="graphSubTitle">选择一个物品开始生成</p>
          </div>
          <div class="toolbar-actions">
            <button id="zoomOutBtn" type="button" title="缩小">−</button>
            <button id="zoomResetBtn" type="button" title="重置缩放">100%</button>
            <button id="zoomInBtn" type="button" title="放大">+</button>
            <button id="fitBtn" type="button">适配</button>
            <button id="exportImageBtn" type="button" disabled>导出图片</button>
            <button id="resetChecklistBtn" type="button" title="清空思维导图勾选">重置勾选</button>
          </div>
        </header>

        <div class="content-grid">
          <div class="graph-panel">
            <div id="graphViewport" class="graph-viewport">
              <div id="graphCanvas" class="graph-canvas">
                <svg id="edgeLayer" class="edge-layer" xmlns="http://www.w3.org/2000/svg"></svg>
                <div id="nodeLayer" class="node-layer"></div>
              </div>
            </div>
          </div>

          <aside class="summary-panel">
            <section>
              <h3>基础信息</h3>
              <div id="rightItemInfo" class="right-item-info"></div>
            </section>
            <section>
              <h3>直接配方</h3>
              <div id="directRecipe" class="recipe-grid"></div>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
