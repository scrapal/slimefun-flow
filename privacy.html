      <h1>隐私政策</h1>
      <p>本工具默认在浏览器本地运行，不需要登录账户。</p>
      <h2>本地存储</h2>
      <p>为了保存你的材料勾选进度，本站会使用浏览器 <code>localStorage</code>。这些数据保存在你的设备上，不会主动上传到服务器。</p>
      <h2>导入文件</h2>
      <p>如果你使用“导入配方 JSON”，文件会在浏览器本地解析。本站不会主动上传你选择的文件。</p>
      <h2>统计与广告</h2>
      <p>当前版本未接入第三方统计或广告代码。未来如果接入广告或统计服务，本页会更新说明相关服务可能收集的数据类型。</p>
      <h2>联系方式</h2>
      <p>部署到正式域名后，请在这里填写站点所有者的联系邮箱或反馈入口。</p>
    </main>
